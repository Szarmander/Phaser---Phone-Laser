<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Phaser Remote</title>
    <link rel="icon" href="icon.jpg">
    <link rel="apple-touch-icon" href="icon.jpg">
    <link rel="stylesheet" href="mobile.css">
</head>
<body>
    <div class="header">
        <div class="controls">
            <button id="btn-off">Off</button>
            <button id="btn-laser" class="active">Phaser</button>
            <button id="btn-highlight">Highlight</button>
        </div>
    </div>
    <div id="touchpad">
        <p>Touch & Drag to Move</p>
    </div>
    <div class="footer">
        <div class="controls">
            <button id="btn-prev" style="font-size: 24px; padding: 15px 0;">⬅️</button>
            <button id="btn-next" style="font-size: 24px; padding: 15px 0;">➡️</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="mobile.js"></script>
</body>
</html>
