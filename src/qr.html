<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phaser</title>
    <link rel="icon" href="../icon.jpg">
    <link rel="stylesheet" href="qr.css">
</head>
<body>
    <div class="container">
        <header class="header-banner">
            <img class="logo" src="../icon.jpg" alt="Phaser Logo">
            <h1>Phaser Controller</h1>
        </header>

        <div id="connection-status" class="status-banner connected hidden">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span>Phone Connected!</span>
        </div>

        <div id="loading-state" class="loading-state">
            <div class="spinner"></div>
            <p>Establishing secure tunnel...</p>
        </div>

        <div id="qr-section" class="qr-section hidden">
            <p>Scan the QR code with your phone to connect.</p>

            <div id="qr-container">
                <img id="qr-image" src="" alt="QR Code" class="hidden">
            </div>

            <p class="url" id="url-text">Loading...</p>
        </div>

        <div class="settings">
            <label for="display-select">Target Monitor:</label>
            <select id="display-select">
                <!-- Options populated dynamically -->
            </select>
        </div>
    </div>

    <script src="qr.js"></script>
</body>
</html>
